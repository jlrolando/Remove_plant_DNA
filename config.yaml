# =============================================================================
# Configuration for plant contig filtering pipeline
# Designed for HiPerGator (UF HPC) with SLURM
# =============================================================================

# --- Input ---
contigs: "/path/to/seagrass_root_metagenome_contigs.fasta"
sample_name: "seagrass_root"

# --- Output directory ---
# Recommended: use /blue/<group>/<user>/ for persistent storage
outdir: "results"

# --- CAT database paths ---
# Prepared with: CAT prepare --fresh -d cat_db -t cat_tax
cat_db: "/path/to/CAT_prepare/db"
cat_taxonomy: "/path/to/CAT_prepare/tax"

# --- Kraken2 database ---
# Standard, PlusPF, or custom Kraken2 database
kraken2_db: "/path/to/kraken2_db"

# --- NCBI taxonomy nodes.dmp (for Kraken2 lineage resolution) ---
# Usually found in the Kraken2 database directory or NCBI taxdump
taxonomy_nodes: "/path/to/nodes.dmp"

# --- CAT parameters ---
cat_r: 10       # number of top DIAMOND hits per ORF
cat_f: 0.5      # fraction of hits supporting a classification

# --- Kraken2 parameters ---
kraken2_confidence: 0.1

# --- Viridiplantae NCBI taxonomy ID ---
viridiplantae_taxid: 33090

# --- Prokaryotic superkingdom keywords (used by CAT ORF filter) ---
prokaryotic_keywords:
  - "Bacteria"
  - "Archaea"

# --- Threads ---
threads: 16

# --- HiPerGator SLURM resources ---
# SLURM partition (hpg-default for most jobs, bigmem for high-memory)
partition: "hpg-default"
# SLURM account (your HiPerGator group account)
slurm_account: "your_group_account"
# SLURM QOS
qos: "your_group_account"

# Per-rule memory (MB) and time (minutes) overrides
# CAT is the heaviest — DIAMOND against NR needs substantial RAM
cat_mem_mb: 64000       # 64 GB
cat_time_min: 2880      # 48 hours
# Kraken2 loads entire DB into memory
kraken2_mem_mb: 64000   # 64 GB (adjust to DB size)
kraken2_time_min: 120   # 2 hours
